---

# Any ignore directives should be uncommented in downstream projects to disable
# Dependabot updates for the given dependency. Downstream projects will get
# these updates when the pull request(s) in the appropriate skeleton are merged
# and Lineage processes these changes.

updates:
  - directory: /
    ignore:
      # Python 3.14 has changes to the asyncio library that are incompatible
      # with the versions of black and click that we need to use. Therefore, we
      # must stay on Python 3.13.
      - dependency-name: library/python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    package-ecosystem: docker
    schedule:
      interval: weekly

  - directory: /
    ignore:
      # Managed by cisagov/skeleton-generic
      - dependency-name: actions/cache
      - dependency-name: actions/checkout
      - dependency-name: actions/dependency-review-action
      - dependency-name: actions/labeler
      - dependency-name: actions/setup-go
      - dependency-name: actions/setup-python
      - dependency-name: cisagov/action-job-preamble
      - dependency-name: cisagov/setup-env-github-action
      - dependency-name: crazy-max/ghaction-github-labeler
      - dependency-name: github/codeql-action
      - dependency-name: hashicorp/setup-packer
      - dependency-name: hashicorp/setup-terraform
      - dependency-name: mxschmitt/action-tmate
      # Managed by cisagov/skeleton-action-composite
      - dependency-name: zyactions/semver
    labels:
      # dependabot default we need to replicate
      - dependencies
      # This matches our label definition in .github/labels.yml as opposed to
      # dependabot's default of `github_actions`.
      - github-actions
    package-ecosystem: github-actions
    schedule:
      interval: weekly

  - directory: /
    package-ecosystem: pip
    schedule:
      interval: weekly

  - directory: /src
    ignore:
      # We cannot use newer versions of these packages so it is pointless to get
      # updates offered.
      - dependency-name: black
      - dependency-name: click
    package-ecosystem: pip
    schedule:
      interval: weekly

  - directory: /
    package-ecosystem: terraform
    schedule:
      interval: weekly
version: 2
